name: Fork image (ghcr)

# Fork-specific pipeline: the deployment host is too small to compile this project
# (2 cores / 3 GB RAM), so GitHub Actions is the only compiler and image builder.
# Result: ghcr.io/<owner>/ag-tools, consumed by the Dokploy app `sidequests/agtools`.

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
    paths-ignore:
      - "README*.md"
      - "docs/**"
      - "web_site/**"
      - "Casks/**"
  workflow_dispatch:
    inputs:
      push_image:
        description: "Build and push the image to ghcr"
        type: boolean
        default: true

concurrency:
  # Keyed by commit, not by branch: a follow-up push must not cancel an image build
  # that is already halfway through a release compile.
  group: fork-image-${{ github.sha }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ag-tools

jobs:
  # Fast feedback: types + rust compile. Linux only — the fork ships a Linux container,
  # cross-platform desktop builds stay in the upstream ci.yml.
  check:
    name: Check (tsc + cargo)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install frontend deps
        run: npm install --legacy-peer-deps

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Install Rust build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            pkg-config libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libnm-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"

      # Upstream's tree does not pass `cargo fmt --check` (see account.rs / integration.rs),
      # so the gate is scoped to the files this fork adds.
      - name: rustfmt (fork files)
        run: |
          files="
            src-tauri/src/models/provider.rs
            src-tauri/src/modules/openai_oauth.rs
            src-tauri/src/modules/openai_account.rs
            src-tauri/src/proxy/providers/openai_codex.rs
          "
          rustfmt --edition 2021 --check $files

      - name: cargo check
        run: cd src-tauri && cargo check --bin antigravity-tools

      - name: cargo clippy
        run: cd src-tauri && cargo clippy --bin antigravity-tools

      # Filter `openai_` matches this fork's modules (openai_oauth / openai_account /
      # openai_codex) and its `openai_*` test names, while excluding upstream's
      # `mappers::openai::*` suite — two of those tests already fail on upstream main.
      - name: Rust tests (fork modules only)
        run: cd src-tauri && cargo test openai_ -- --nocapture

  image:
    name: Build & push headless image
    needs: check
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.push_image)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          build-args: |
            USE_MIRROR=false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Boot the image we just pushed: compiling is not the same as starting, and the
      # deployment host is too small to try this locally.
      - name: Smoke test the image
        run: |
          set -euo pipefail
          tag=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          echo "booting $tag"
          docker run -d --name agtools-smoke \
            -e API_KEY=smoke-test-key \
            -e ABV_BIND_LOCAL_ONLY=false \
            -p 8045:8045 "$tag"

          for i in $(seq 1 30); do
            if curl -fsS -m 3 http://127.0.0.1:8045/health > /tmp/health.json; then
              break
            fi
            sleep 2
          done

          echo "--- /health ---"; cat /tmp/health.json; echo
          grep -q '"status"' /tmp/health.json

          # The Web UI must be served from the bundled dist.
          curl -fsS -m 5 http://127.0.0.1:8045/ | head -c 200; echo

          # The new ChatGPT endpoints must exist and be behind admin auth (401/403),
          # never 404 — a 404 would mean the routes did not make it into the build.
          for path in /api/accounts/openai/auth/url /api/stats/providers; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 5 "http://127.0.0.1:8045$path")
            echo "$path -> $code"
            case "$code" in
              401|403) ;;
              *) echo "unexpected status for $path"; docker logs agtools-smoke | tail -40; exit 1 ;;
            esac
          done

          echo "--- authenticated provider stats ---"
          curl -fsS -m 5 -H "Authorization: Bearer smoke-test-key" \
            "http://127.0.0.1:8045/api/stats/providers" | head -c 200; echo

          docker logs agtools-smoke | tail -20
          docker rm -f agtools-smoke > /dev/null

      - name: Summary
        run: |
          {
            echo "### Image pushed"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "Deploy: point the Dokploy app \`sidequests/agtools\` at one of these tags."
          } >> "$GITHUB_STEP_SUMMARY"
